name = "sixpack"
version = "0.1.0"
defaultTargets = ["Sixpack"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.24.0"

[[lean_lib]]
name = "Sixpack"
# Request Lean's allocation limit without invalidating checked artifacts.
# Physical memory is monitored separately by audit/run_lean_memory_guard.py.
weakLeanArgs = ["-M4096"]
